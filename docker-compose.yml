services:
  market-server:
    build:
      context: .
      dockerfile: apps/market-server/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - HOST=0.0.0.0
      - QUESTDB_HTTP_URL=${QUESTDB_HTTP_URL:-http://127.0.0.1:9000}
      - LOG_LEVEL=info

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MARKET_GATEWAY_INTERNAL_URL=http://gateway:9001/v1
      - NEXT_PUBLIC_API_URL=http://localhost:9001/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:9001/v1/stream
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
