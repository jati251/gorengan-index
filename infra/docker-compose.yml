version: "3.8"

services:
  nats:
    image: nats:latest
    container_name: market-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS monitoring dashboard
    volumes:
      - nats-data:/data
    networks:
      - market-net

  questdb:
    image: questdb/questdb:latest
    container_name: market-questdb
    restart: unless-stopped
    ports:
      - "9000:9000" # QuestDB Web Console & REST API
      - "9009:9009" # Influx Line Protocol (ILP) TCP
      - "8812:8812" # PostgreSQL Wire Protocol
    environment:
      - QDB_CACHED_DOUBLE_FORMAT=false
    volumes:
      - questdb-data:/var/lib/questdb
    networks:
      - market-net

  valkey:
    image: valkey/valkey:latest
    container_name: market-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - market-net

  prometheus:
    image: prom/prometheus:latest
    container_name: market-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - market-net

  grafana:
    image: grafana/grafana:latest
    container_name: market-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - market-net

volumes:
  nats-data:
  questdb-data:
  valkey-data:
  prometheus-data:
  grafana-data:

networks:
  market-net:
    driver: bridge
