[workspace]
resolver = "2"
members = [
    "crates/market-domain",
    "crates/market-protocol",
    "crates/config",
    "apps/collector",
    "apps/aggregator",
    "apps/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
async-nats = "0.38"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.15"
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }

# Local workspace crate dependencies
market-domain = { path = "crates/market-domain" }
market-protocol = { path = "crates/market-protocol" }
market-config = { path = "crates/config" }
